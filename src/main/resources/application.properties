spring.application.name=customer-service
server.port=8081
# The published provider contract is OAS 3.0; nothing here needs 3.1 features, and 3.0 is the
# broadest-supported input for PactFlow's bi-directional comparison.
springdoc.api-docs.version=openapi_3_0
# Fail rather than coerce wrong-typed JSON into the documented schema: without this, {"name": false}
# is accepted as the string "false", which no OpenAPI consumer would expect.
spring.jackson.mapper.allow-coercion-of-scalars=false

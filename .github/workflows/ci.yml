name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled: no point burning a runner on a stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      # Recorded with the version. The build falls back to the git branch, but being explicit keeps
      # detached checkouts honest.
      PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # No broker needed: boots the app, writes build/openapi/openapi.json, compiles the tests.
      - name: Generate the provider contract
        run: ./gradlew openApiSpecTest

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: build/openapi/openapi.json
          retention-days: 7

      # Everything below talks to PactFlow, so it only runs where the secrets exist (pushes to main,
      # not pull requests from forks).
      # Fail with a readable message instead of a connection error: a missing secret arrives as "".
      - name: Require PactFlow secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "$PACT_BROKER_BASE_URL" ] || [ -z "$PACT_BROKER_TOKEN" ]; then
            echo "::error::Set PACT_BROKER_BASE_URL and PACT_BROKER_TOKEN in Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Verify consumer pacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew test

      - name: Publish the provider contract
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew publishProviderContract

      # Compares this provider version with whatever is deployed to `production`.
      - name: Can I deploy?
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(git rev-parse --short=12 HEAD)
          docker run --rm \
            -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN \
            pactfoundation/pact-cli pact-broker can-i-deploy \
            --pacticipant customer-service --version "$version" \
            --to-environment production \
            --retry-while-unknown 10 --retry-interval 5
